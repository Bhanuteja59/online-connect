
<!-- Bootstrap CSS & JS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>


  <style>
    .custom-navbar {
      font-family: 'Segoe UI', sans-serif;
    }

    .custom-navbar header {
      background-color:rgb(255, 255, 255);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 999;   
      transition: background-color 0.3s ease;
      height: 80px; /* define exact height */
    }

    body {
      padding-top: 80px; /* prevent header overlap */
    }

    .custom-navbar .logo {
      font-size: 1.6rem;
      font-weight: bold;
      text-decoration: none;
    }

    .custom-navbar nav {
      display: flex;
      gap: 1.5rem;
    }

    .custom-navbar nav a {
      position: relative;
      text-decoration: none;
      color: #333;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .custom-navbar nav a:hover {
      color: #0d6efd;
    }

    /* ✨ Hover underline animation */
    .custom-navbar nav a::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 2px;
      left: 0;
      bottom: -4px;
      background-color: #0d6efd;
      transition: width 0.3s ease;
    }

    .custom-navbar nav a:hover::after {
      width: 100%;
    }

    .custom-navbar .menu-toggle {
      display: none;
    }

    .custom-navbar .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 6px;
      padding: 10px;
    }

    .custom-navbar .hamburger span {
      width: 25px;
      height: 3px;
      background-color: #333;
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .custom-navbar nav {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #fff;
        flex-direction: column;
        align-items: center;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }

      .custom-navbar .menu-toggle:checked + .hamburger + nav {
        max-height: 400px;
        padding: 1rem;
        border-top: 1px solid #ddd;
      }

      .custom-navbar .hamburger {
        display: flex;
      }

      .custom-navbar nav a {
        padding: 0.5rem 0;
      }
    }
  </style>
<body>

  <section class="custom-navbar">
    <header class="bg-white shadow-sm">
      <div class="container d-flex justify-content-between align-items-center h-100 px-4">
        <a href="/" class="logo text-primary">OnlineConnect</a>

        <input type="checkbox" id="menu-toggle" class="menu-toggle" />
        <label for="menu-toggle" class="hamburger" aria-label="Toggle navigation menu">
          <span></span>
          <span></span>
          <span></span>
        </label>

        <nav class="rounded">
          <a class="nav-link" href="/">Home</a>
          <a class="nav-link" href="/designs">Designs</a>
          <a class="nav-link" href="/services">Services</a>
          <a class="nav-link" href="/pricing">Pricing</a>
          <a class="nav-link" href="/faq">FAQs</a>
          <a class="nav-link" href="/contact">Contact</a>
        </nav>
      </div>
    </header>
  </section>

</body>
