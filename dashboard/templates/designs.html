{% load static %}  

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

{% include 'partials/header.html' %}


<section id="gallery" class="py-5 bg-light">

      <ul class="nav nav-pills justify-content-center mb-4" id="gallery-tabs">

          <a class="nav-link active" data-bs-toggle="pill" href="#classic">Classic</a>

        <li class="nav-item">

      <div class="tab-content">

          <div class="row g-4">
            <div class="col-md-4">

            <div class="col-md-4">
              <img src="https://source.unsplash.com/400x600/?wedding,invitation,traditional" alt="Classic Design 2"

              <img src="https://source.unsplash.com/400x600/?wedding,invitation,minimal" alt="Minimalist Design 3"

        <div class="tab-pane fade" id="themed">
